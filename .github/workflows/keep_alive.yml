name: Keep Hugging Face Space Alive

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Hugging Face Space
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP GET request
        run: |
          echo "Pinging Hugging Face Space..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://harsh0o23-seaanimal-api.hf.space/ || true)
          echo "Received HTTP status: $STATUS_CODE"
